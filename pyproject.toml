[project]
name = "linteum"
version = "0.0.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "openai>=3.26.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
web = ["websockets>=13"]
tui = ["textual>=0.80"]

[project.scripts]
linteum = "linteum_agent.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["linteum_agent"]


