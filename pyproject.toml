[project]
name = "linteum"
version = "0.2.0-alpha.1"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "openai>=3.26.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
web = ["websockets>=13"]

[project.scripts]
linteum = "linteum_agent.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["linteum_agent"]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]

[tool.ruff]
# Pin the rule set explicitly: ruff's defaults have widened across releases.
target-version = "py312"
line-length = 100
src = ["linteum_agent"]
exclude = ["linteum-web", "dist"]

[tool.ruff.lint]
# E4 imports, E7 statements, E9 runtime/syntax, F pyflakes (incl. F821).
select = ["E4", "E7", "E9", "F"]


